<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ | Wonder Vietnam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/vhlong.png');
            background-size: cover;
            background-position: bottom;
            height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Wonder Vietnam</a>
        <ul class="nav-links">
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="about.html">Giới Thiệu</a></li>
            <li><a href="services/products/news.html">Tin Tức</a></li>
            <li><a href="contact.html">Liên Hệ</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>Liên Hệ Với Chúng Tôi</h1>
    </header>

    <section>
        <div class="section-title">
            <h2>Gửi tin nhắn cho chúng tôi</h2>
            <p>Chúng tôi luôn sẵn sàng lắng nghe và giải đáp mọi thắc mắc của bạn.</p>
        </div>
        <div class="contact-container">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name" name="name" placeholder="Nhập họ tên của bạn" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
                </div>
                <div class="form-group">
                    <label for="message">Nội dung</label>
                    <textarea id="message" name="message" rows="5" placeholder="Bạn cần tư vấn về điểm đến nào?" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Gửi yêu cầu</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Wonder Vietnam. Thiết kế bởi AI cho nhiệm vụ STEM.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
